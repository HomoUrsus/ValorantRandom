<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Valorant Randomizer — rand55</title>

<style>

/* =========================================================
   Global
========================================================= */

* {
    box-sizing: border-box;
}

html {
    zoom: 0.75;
}

body {
    margin: 0;
    min-height: 100vh;

    padding: 30px 20px 50px;

    display: flex;
    flex-direction: column;
    align-items: center;

    background: #181818;
    color: white;

    font-family: Arial, sans-serif;
}


/* =========================================================
   Result panel
========================================================= */

.result-panel {
    width: min(1180px, 100%);

    margin-bottom: 25px;

    background: #242424;

    border: 1px solid #3a3a3a;

    border-radius: 12px;

    overflow: hidden;
}

.result-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 12px 20px;

    background: #303030;
}

.result-heading {
    display: flex;
    align-items: center;

    gap: 12px;
}

.result-title {
    font-size: 20px;
    font-weight: bold;
}

#results {
    min-height: 250px;

    max-height: 500px;

    overflow-y: auto;

    padding: 10px 20px;

    box-sizing: border-box;
}

.empty-message {
    padding: 10px 0;

    color: #888;
}


/* =========================================================
   Result row
========================================================= */

.result-row {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;

    padding: 10px 0;

    border-bottom: 1px solid #333;
}

.result-row:last-child {
    border-bottom: none;
}

.result-row.locked {
    background: rgba(181, 138, 36, 0.10);
}

.result-text {
    flex: 1;

    font-size: 16px;

    word-break: break-word;
}

.result-row.signature .result-text {
    color: #e0b84f;

    font-weight: bold;

    text-shadow: 0 0 8px rgba(224, 184, 79, 0.18);
}

.result-actions {
    display: flex;
    align-items: center;

    gap: 6px;

    flex-wrap: wrap;
}

.result-action-button {
    min-width: auto;

    padding: 7px 10px;

    font-size: 11px;
}

.lock-button {
    background: #555;

    color: white;
}

.lock-button.locked {
    background: #b58a24;

    color: white;
}

.delete-row-button {
    background: #7c3030;

    color: white;
}


/* =========================================================
   Inputs
========================================================= */

.inputs {
    width: min(1180px, 100%);

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 20px;

    margin-bottom: 25px;
}

.player-input-column {
    min-width: 0;
}

.player-toggle-list {
    display: flex;
    flex-wrap: wrap;

    gap: 7px;

    margin-top: 9px;
}

.player-toggle {
    display: flex;
    align-items: center;

    gap: 6px;

    padding: 5px 9px;

    border: 1px solid #484848;
    border-radius: 8px;

    background: #292929;
    color: #8d8d8d;

    cursor: pointer;
    user-select: none;

    font-size: 11px;
    font-weight: 900;
}

.player-toggle:has(input:checked) {
    border-color: var(--player-color, #777);

    background:
        linear-gradient(
            145deg,
            color-mix(
                in srgb,
                var(--player-color, #666) 42%,
                #222
            ),
            #252525
        );

    color: white;
}

.player-toggle input {
    width: 14px;
    height: 14px;

    margin: 0;

    accent-color: var(--player-color, #777);
}

body.draft-animating .player-toggle-list {
    opacity: 0.45;

    pointer-events: none;
}

textarea {
    width: 100%;

    height: 130px;

    padding: 15px;

    resize: vertical;

    border: 1px solid #444;

    border-radius: 10px;

    background: #242424;

    color: white;

    font-family: Arial, sans-serif;

    font-size: 15px;
}

textarea:focus {
    outline: 1px solid #777;
}


/* =========================================================
   Wheels
========================================================= */

.wheel-area {
    width: min(1180px, 100%);

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 40px;

    flex-wrap: wrap;
}

.wheel-wrapper {
    position: relative;

    width: 300px;

    height: 300px;

    border-radius: 50%;

    border: 6px solid #555;

    background: #333;

    overflow: hidden;

    box-shadow:
        0 0 0 5px #222,
        0 15px 40px rgba(0, 0, 0, 0.5);
}

.casino-reel {
    position: relative;

    display: none;

    width: 270px;
    height: 300px;

    overflow: hidden;

    border: 6px solid #6b5730;
    border-radius: 20px;

    background: #111;

    box-shadow:
        0 0 0 5px #222,
        0 0 24px rgba(232, 183, 68, 0.16),
        0 15px 40px rgba(0, 0, 0, 0.5);
}

body.casino-mode .wheel-wrapper {
    display: none;
}

body.casino-mode .casino-reel {
    display: block;
}

.casino-reel-strip {
    position: absolute;

    top: 0;
    right: 0;
    left: 0;

    will-change: transform;
}

.casino-reel-cell {
    position: relative;

    height: 86px;

    display: flex;
    align-items: center;
    justify-content: center;

    box-sizing: border-box;

    border-top: 1px solid rgba(255, 255, 255, 0.1);
    border-bottom: 1px solid rgba(0, 0, 0, 0.45);

    color: white;

    font-size: 21px;
    font-weight: 900;
    text-align: center;
    text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);
}

.casino-reel-cell.signature-cell {
    color: #fff3b0;

    border-top-color: rgba(255, 235, 153, 0.72);
    border-bottom-color: rgba(112, 68, 0, 0.82);

    box-shadow:
        inset 0 0 0 2px rgba(255, 213, 74, 0.72),
        inset 0 0 18px rgba(255, 204, 51, 0.32),
        0 0 15px rgba(255, 196, 38, 0.2);

    text-shadow:
        0 2px 4px rgba(0, 0, 0, 0.95),
        0 0 9px rgba(255, 221, 99, 0.85);
}

.casino-reel-cell.signature-cell::before {
    position: absolute;

    inset: 0;

    background: linear-gradient(
        112deg,
        transparent 12%,
        rgba(255, 248, 194, 0.08) 33%,
        rgba(255, 235, 137, 0.34) 48%,
        rgba(255, 248, 194, 0.08) 63%,
        transparent 84%
    );

    content: "";
    pointer-events: none;
}

.casino-reel-cell.signature-cell::after {
    position: absolute;

    top: 6px;
    right: 8px;

    padding: 2px 5px;

    border: 1px solid rgba(255, 232, 137, 0.72);
    border-radius: 999px;

    background: rgba(60, 36, 0, 0.72);
    color: #ffe382;

    content: "★ SIG";

    font-size: 8px;
    font-weight: 1000;
    letter-spacing: 0.7px;
    line-height: 1;
    text-shadow: none;
}

.casino-reel-cell.signature-winning-cell {
    animation: signature-cell-glow 1.15s ease-in-out infinite alternate;
}

@keyframes signature-cell-glow {
    from {
        filter: brightness(1);

        box-shadow:
            inset 0 0 0 2px rgba(255, 213, 74, 0.72),
            inset 0 0 18px rgba(255, 204, 51, 0.32),
            0 0 9px rgba(255, 196, 38, 0.28);
    }

    to {
        filter: brightness(1.14);

        box-shadow:
            inset 0 0 0 3px rgba(255, 235, 142, 0.92),
            inset 0 0 25px rgba(255, 210, 67, 0.5),
            0 0 22px rgba(255, 196, 38, 0.62);
    }
}

.casino-reel-payline {
    position: absolute;

    z-index: 3;

    top: 50%;
    right: 0;
    left: 0;

    height: 86px;

    transform: translateY(-50%);

    border-top: 3px solid #e4b842;
    border-bottom: 3px solid #e4b842;

    box-sizing: border-box;

    pointer-events: none;

    box-shadow:
        inset 0 0 18px rgba(255, 218, 108, 0.14),
        0 0 13px rgba(228, 184, 66, 0.28);
}

.casino-reel::before,
.casino-reel::after {
    position: absolute;

    z-index: 2;

    right: 0;
    left: 0;

    height: 78px;

    content: "";

    pointer-events: none;
}

.casino-reel::before {
    top: 0;

    background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.92),
        transparent
    );
}

.casino-reel::after {
    bottom: 0;

    background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.92),
        transparent
    );
}

canvas {
    width: 100%;
    height: 100%;

    display: block;
}

.wheel-column {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.right-display-column {
    display: flex;
    align-items: center;
    justify-content: center;
}

.team-slots-board {
    display: none;

    width: min(1180px, 100%);

    grid-template-columns:
        repeat(
            var(--team-slot-count, 5),
            minmax(155px, 1fr)
        );

    gap: 12px;

    order: -1;

    overflow-x: auto;

    padding: 8px 8px 18px;

    box-sizing: border-box;
}

.team-slot-column {
    min-width: 155px;
}

.team-slot-player {
    position: relative;

    height: 44px;
    min-height: 44px;

    margin-bottom: 9px;

    overflow: hidden;

    border: 3px solid #6b5730;
    border-radius: 11px;

    background: #111;

    box-shadow:
        0 0 0 2px #222,
        0 0 12px rgba(232, 183, 68, 0.15),
        0 5px 14px rgba(0, 0, 0, 0.38);

    box-sizing: border-box;
}

.team-slot-player::before,
.team-slot-player::after {
    position: absolute;
    z-index: 3;

    right: 0;
    left: 0;

    height: 13px;

    content: "";

    pointer-events: none;
}

.team-slot-player::before {
    top: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0, 0, 0, 0.82),
            transparent
        );
}

.team-slot-player::after {
    bottom: 0;

    background:
        linear-gradient(
            to top,
            rgba(0, 0, 0, 0.82),
            transparent
        );
}

.team-player-strip {
    position: absolute;

    top: 0;
    right: 0;
    left: 0;

    transform: translateY(0);

    will-change: transform;
}

.team-player-cell {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 100%;
    height: 38px;

    padding: 0 10px;

    box-sizing: border-box;

    border-top: 1px solid rgba(255, 255, 255, 0.2);
    border-bottom: 1px solid rgba(0, 0, 0, 0.48);

    background:
        linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.2),
            transparent 42%,
            rgba(0, 0, 0, 0.38)
        ),
        var(--player-color, #3d3d3d);

    color: white;

    font-size: 14px;
    font-weight: 900;
    text-align: center;
    white-space: nowrap;

    text-shadow:
        0 2px 4px #000,
        0 0 5px rgba(0, 0, 0, 0.72);
}

.team-slot-player.spinning .team-player-strip {
    filter: blur(0.28px);
}

.team-player-payline {
    position: absolute;
    z-index: 2;

    top: 50%;
    right: 0;
    left: 0;

    height: 38px;

    transform: translateY(-50%);

    border-top: 1px solid rgba(255, 220, 112, 0.72);
    border-bottom: 1px solid rgba(255, 220, 112, 0.72);

    box-sizing: border-box;

    pointer-events: none;

    box-shadow:
        inset 0 0 9px rgba(255, 218, 108, 0.1),
        0 0 7px rgba(228, 184, 66, 0.2);
}

.team-slot-player.settled {
    animation: team-player-settle 0.42s ease-out;
}

@keyframes team-player-settle {
    0% {
        transform: scale(1.16);
        box-shadow:
            0 0 0 2px #2b2519,
            0 0 20px rgba(255, 203, 65, 0.55),
            0 5px 14px rgba(0, 0, 0, 0.38);
    }

    100% {
        transform: scale(1);
        box-shadow:
            0 0 0 2px #222,
            0 0 12px rgba(232, 183, 68, 0.15),
            0 5px 14px rgba(0, 0, 0, 0.38);
    }
}

.team-casino-reel {
    display: block;

    width: 100%;
    min-width: 155px;
    height: 300px;

    border-color: #5d5138;
}

.team-casino-reel.dramatic-slow-motion {
    animation: dramatic-reel-focus 1.15s ease-in-out infinite alternate;
}

@keyframes dramatic-reel-focus {
    from {
        box-shadow:
            0 0 0 5px #222,
            0 0 16px rgba(232, 183, 68, 0.2),
            0 15px 40px rgba(0, 0, 0, 0.5);
    }

    to {
        box-shadow:
            0 0 0 5px #2b2519,
            0 0 34px rgba(255, 203, 65, 0.55),
            0 15px 45px rgba(0, 0, 0, 0.65);
    }
}

.team-slots-settings-button {
    display: none;
}

body.team-slots-mode .primary-display-column,
body.team-slots-mode .right-display-column {
    display: none;
}

body.team-slots-mode .team-slots-board {
    display: grid;
}

body.team-slots-mode .team-slots-settings-button {
    display: block;

    order: 2;
}

body.team-slots-mode .controls {
    order: 1;

    width: 100%;

    flex-direction: row;
    justify-content: center;
    flex-wrap: wrap;
}

body.team-slots-mode .controls button {
    min-width: 150px;
}

.wheel-settings-button {
    width: 30px;
    height: 24px;
    min-width: 0;

    margin-top: 14px;

    padding: 0;

    border: none;
    border-radius: 6px;

    background: transparent;
    color: #777;

    font-size: 14px;

    opacity: 0.2;
}

.wheel-settings-button:hover {
    transform: none;

    opacity: 0.55;
}

.wheel-settings-overlay {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(0, 0, 0, 0.56);
}

.wheel-settings-overlay.open {
    display: flex;
}

.wheel-settings-panel {
    width: min(320px, 100%);

    padding: 18px;

    border: 1px solid #454545;
    border-radius: 12px;

    background: #242424;

    box-shadow: 0 18px 55px rgba(0, 0, 0, 0.55);
}

.wheel-settings-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 14px;
}

.wheel-settings-title {
    font-size: 16px;
    font-weight: bold;
}

.wheel-settings-close {
    width: 30px;
    height: 30px;
    min-width: 0;

    padding: 0;

    background: #3c3c3c;
    color: white;
}

.wheel-design-options {
    display: flex;
    flex-direction: column;

    gap: 8px;
}

.wheel-design-option {
    width: 100%;
    min-width: 0;

    background: #3a3a3a;
    color: white;
}

.wheel-design-option.active {
    outline: 2px solid #d0d0d0;

    background: #555;
}

.wheel-settings-subtitle {
    margin-top: 18px;
    margin-bottom: 8px;

    color: #aaa;

    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1.2px;
}

.spin-style-options {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 8px;
}

.spin-style-option {
    width: 100%;
    min-width: 0;

    padding-right: 8px;
    padding-left: 8px;

    background: #3a3a3a;
    color: white;
}

.spin-style-option.active {
    outline: 2px solid #d0d0d0;

    background: #6b5730;
}

.sound-toggle {
    width: 100%;
    min-width: 0;

    background: #3a3a3a;
    color: white;
}

.sound-toggle.active {
    outline: 2px solid #6f8d64;

    background: #42543c;
}

.audio-volume-row {
    display: grid;
    align-items: center;

    grid-template-columns: 58px 1fr 42px;

    gap: 10px;

    margin-top: 10px;

    color: #aaa;

    font-size: 11px;
    font-weight: bold;
}

.audio-volume-row input[type="range"] {
    width: 100%;

    accent-color: #8aa77e;

    cursor: pointer;
}

.audio-volume-value {
    color: #ddd;

    text-align: right;
}

.casino-reel-cell.near-miss-flash {
    z-index: 4;

    animation: near-miss-cell-flash 0.62s ease-in-out 2;
}

.team-casino-reel.near-miss-reel {
    animation: near-miss-reel-shake 0.58s ease-in-out;
}

body.near-miss-shake .main {
    animation: near-miss-screen-shake 0.52s ease-in-out;
}

@keyframes near-miss-cell-flash {
    0%, 100% {
        filter: brightness(1);
    }

    48% {
        filter: brightness(1.8) saturate(1.35);

        box-shadow:
            inset 0 0 0 4px #fff2a5,
            inset 0 0 32px rgba(255, 218, 75, 0.82),
            0 0 34px #ffca28;
    }
}

@keyframes near-miss-reel-shake {
    0%, 100% { transform: translateX(0); }
    18% { transform: translateX(-7px) rotate(-0.8deg); }
    36% { transform: translateX(7px) rotate(0.8deg); }
    54% { transform: translateX(-5px); }
    72% { transform: translateX(4px); }
    88% { transform: translateX(-2px); }
}

@keyframes near-miss-screen-shake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-5px, 2px); }
    40% { transform: translate(5px, -2px); }
    60% { transform: translate(-3px, -1px); }
    80% { transform: translate(3px, 1px); }
}

.signature-celebration {
    position: fixed;

    z-index: 250;

    top: 50%;
    left: 50%;

    opacity: 0;

    transform: translate(-50%, -50%) scale(0.35) rotate(-8deg);

    color: #ffd65a;

    font-size: clamp(74px, 12vw, 170px);
    font-weight: 1000;
    line-height: 0.9;
    letter-spacing: -5px;
    text-align: center;
    text-shadow:
        0 0 8px #fff2a8,
        0 0 22px #ffbd27,
        0 8px 0 #8a4d00,
        0 14px 30px rgba(0, 0, 0, 0.9);

    pointer-events: none;
}

.signature-celebration.show {
    animation: signature-hit 1.25s ease-out forwards;
}

.signature-celebration.jackpot {
    color: #fff0a6;

    font-size: clamp(58px, 10vw, 145px);
    letter-spacing: 2px;
    text-shadow:
        0 0 9px white,
        0 0 25px #ffd52e,
        0 0 55px #ff3d00,
        0 9px 0 #8a2400,
        0 17px 35px rgba(0, 0, 0, 0.95);
}

.signature-celebration.loser {
    color: #ff3f3f;

    font-size: clamp(68px, 11vw, 158px);
    letter-spacing: 1px;
    text-shadow:
        0 0 8px #ffb0b0,
        0 0 24px #ff1d1d,
        0 0 50px rgba(177, 0, 0, 0.9),
        0 8px 0 #720000,
        0 16px 32px rgba(0, 0, 0, 0.95);
}

.signature-celebration.long {
    width: min(94vw, 1280px);

    font-size: clamp(42px, 8vw, 112px);
    letter-spacing: -1px;
}

@keyframes signature-hit {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.25) rotate(-10deg);
    }

    24% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18) rotate(3deg);
    }

    48% {
        transform: translate(-50%, -50%) scale(0.96) rotate(-1deg);
    }

    72% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(0);
    }

    100% {
        opacity: 0;
        transform: translate(-50%, -58%) scale(1.12) rotate(0);
    }
}

.team-ready-overlay {
    position: fixed;

    inset: 0;

    z-index: 235;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 6px;

    opacity: 0;
    visibility: hidden;

    background: rgba(5, 6, 8, 0.88);
    backdrop-filter: blur(7px);

    transition:
        opacity 0.32s ease,
        visibility 0.32s ease;
}

.team-ready-overlay.show {
    opacity: 1;
    visibility: visible;
}

.team-ready-panel {
    position: relative;

    width: min(1900px, 70vw);

    height: auto;
    max-height: calc(105vh - 12px);
    box-sizing: border-box;

    zoom: 1.2;

    overflow-y: auto;
    scrollbar-width: none;

    padding: 34px 28px 25px;

    border: 1px solid #4a4a4a;
    border-radius: 20px;

    background:
        radial-gradient(circle at 50% 0%, rgba(64, 104, 151, 0.24), transparent 45%),
        linear-gradient(145deg, #242424, #121212);

    box-shadow:
        0 0 0 5px rgba(255, 255, 255, 0.025),
        0 28px 90px rgba(0, 0, 0, 0.8);

    transform: translateY(22px) scale(0.94);

    transition: transform 0.38s cubic-bezier(0.2, 0.9, 0.25, 1.15);
}

.team-ready-panel::-webkit-scrollbar {
    display: none;
}

.team-ready-overlay.show .team-ready-panel {
    transform: translateY(0) scale(1);
}

.team-ready-title {
    margin-bottom: 25px;

    color: white;

    font-size: clamp(32px, 5vw, 58px);
    font-weight: 1000;
    letter-spacing: 5px;
    text-align: center;
    text-shadow: 0 5px 22px rgba(0, 0, 0, 0.75);
}

.team-ready-grid {
    display: grid;

    grid-template-columns:
        repeat(
            var(--team-ready-count, 5),
            minmax(120px, 1fr)
        );

    gap: 10px;
}

.team-ready-card {
    min-width: 0;

    padding: 16px 10px;

    border: 1px solid #4b4b4b;
    border-radius: 12px;

    background: linear-gradient(160deg, #343434, #202020);

    text-align: center;
}

.team-ready-card.signature {
    border-color: #e0b638;

    background:
        radial-gradient(circle at 50% 0%, rgba(255, 218, 87, 0.24), transparent 58%),

/* =========================================================

.pointer {
    position: absolute;

    top: -3px;

    left: 50%;

    transform: translateX(-50%);

    width: 0;
    height: 0;

    border-left: 18px solid transparent;
    border-right: 18px solid transparent;

    border-top: 35px solid white;

    z-index: 5;

    filter:
        drop-shadow(
            0 2px 3px black
        );
}

========================================================= */

    gap: 9px;

    border-radius: 8px;

    background: white;

    color: black;

    font-size: 14px;

    font-weight: bold;

            playerKey
        ] || [];

    const personalDebuffs =
        TEAM_READY_PLAYER_DEBUFFS[
            playerKey
        ] || [];

        ...availableDebuffs.filter(
            debuff =>
                !excludedDebuffs.includes(
                    debuff

        ),
        ...personalDebuffs
    ];

function renderPlayerToggles(
    players
) {

    const currentKeys =
        new Set(
            players.map(
                getPlayerKey
            )
        );


    Array.from(
        excludedPlayerKeys
    )
    .forEach(
        key => {

            if (!currentKeys.has(key)) {
                excludedPlayerKeys.delete(key);
            }

        }
    );


    playerToggleList.replaceChildren(
        ...players.map(
            player => {

                const key =
                    getPlayerKey(
                        player
                    );

                const label =
                    document.createElement(
                        "label"
                    );

                label.className =
                    "player-toggle";

                label.style.setProperty(
                    "--player-color",
                    getPlayerDesignColor(
                        player
                    ) || "#777"
                );


                const checkbox =
                    document.createElement(
                        "input"
                    );

                checkbox.type =
                    "checkbox";

                checkbox.checked =
                    !excludedPlayerKeys.has(
                        key
                    );


                const name =
                    document.createElement(
                        "span"
                    );

                name.textContent =
                    player;


                checkbox.addEventListener(
                    "change",
                    () => {

                        if (checkbox.checked) {

                            excludedPlayerKeys.delete(
                                key
                            );

                        } else {

                            excludedPlayerKeys.add(
                                key
                            );

                        }


                        updateValues();

                    }
                );


                label.append(
                    checkbox,
                    name
                );


                return label;

            }
        )
    );


    const onlySignatureLabel =
        document.createElement(
            "label"
        );

    onlySignatureLabel.className =
        "player-toggle only-signature-toggle";

    onlySignatureLabel.style.setProperty(
        "--player-color",

function getPlayerDesignColor(

function mixHexColors(
    colors
) {

    const totals =
        colors.reduce(
            (sum, color) => {

                const hex =
                    color.replace("#", "");


                sum.red +=
                    parseInt(
                        hex.slice(0, 2),
                        16
                    );

                sum.green +=
                    parseInt(
                        hex.slice(2, 4),
                        16
                    );

                sum.blue +=
                    parseInt(
                        hex.slice(4, 6),
                        16
                    );


                return sum;

            },
            {
                red: 0,
                green: 0,
                blue: 0
            }
        );


    const toHex =
        value =>
            Math.round(
                value / colors.length
            )
            .toString(16)
            .padStart(2, "0");


    return `#${
        toHex(totals.red)
    }${
        toHex(totals.green)
    }${
        toHex(totals.blue)
    }`;

}


function getWheelSegmentStyle(
    ctx,
    value,
    index,
    valuesLength
) {

    if (
        wheelDesignMode ===
        "grayscale"
    ) {

        return `hsl(
            0,
            0%,
            ${
                index % 2 === 0
                    ? 48
                    : 34
            }%
        )`;

    }


    if (
        wheelDesignMode ===
        "players"
    ) {

        if (ctx === ctx1) {

            return getPlayerDesignColor(
                value
            ) || (
                index % 2 === 0
                    ? "#777"
                    : "#555"
            );

        }


        const signatureColors =
            Object.entries(
                SIGNATURE_AGENTS
            )
            .filter(
                ([player, agents]) =>
                    agents.includes(
                        value
                    ) &&
                    getPlayerDesignColor(
                        player
                    )
            )
            .map(
                ([player]) =>
                    getPlayerDesignColor(
                        player
                    )
            );


        const uniqueColors = [
            ...new Set(
                signatureColors
            )
        ];


        if (uniqueColors.length === 1) {

            return uniqueColors[0];

        }


        if (uniqueColors.length > 1) {

            return mixHexColors(
                uniqueColors
            );

        }


        return index % 2 === 0
            ? "#707070"
            : "#505050";

    }


    const hue =
        (
            index *
            360 /
            valuesLength +
            190
        ) % 360;


    return `hsl(
        ${hue},
        65%,
        ${
            index % 2 === 0
                ? 48
                : 38
        }%
    )`;

}


/* =========================================================
   Draw wheel
========================================================= */

function drawWheel(
    ctx,
    values,
    rotation
) {

    if (ctx === ctx1) {

        wheel1Rotation =
            rotation;

    } else if (ctx === ctx2) {

        wheel2Rotation =
            rotation;

    }

    const canvas =
        ctx.canvas;

    const width =
        canvas.width;

    const height =
        canvas.height;

    const centerX =
        width / 2;

    const centerY =
        height / 2;

    const radius =
        width / 2;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /* Empty wheel */

    if (
        values.length === 0
    ) {

        ctx.beginPath();

        ctx.arc(
            centerX,
            centerY,
            radius - 5,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#2d2d2d";

        ctx.fill();


        ctx.fillStyle =
            "#888";

        ctx.font =
            "30px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            "EMPTY",
            centerX,
            centerY
        );

        return;

    }


    const segmentAngle =
        (
            Math.PI * 2
        ) /
        values.length;


    values.forEach(
        (
            value,
            index
        ) => {


            const startAngle =
                rotation +
                index *
                segmentAngle;


            const endAngle =
                startAngle +
                segmentAngle;


            /* Segment */

            ctx.beginPath();

            ctx.moveTo(
                centerX,
                centerY
            );

            ctx.arc(
                centerX,
                centerY,
                radius - 5,
                startAngle,
                endAngle
            );

            ctx.closePath();


            ctx.fillStyle =
                getWheelSegmentStyle(
                    ctx,
                    value,
                    index,
                    values.length
                );


            ctx.fill();


            ctx.strokeStyle =
                "#111";

            ctx.lineWidth =
                3;

            ctx.stroke();


            /* =================================================
               Text
            ================================================= */

            const textAngle =
                startAngle +
                segmentAngle / 2;


            const textRadius =
                radius * 0.62;


            const textX =
                centerX +
                Math.cos(
                    textAngle
                ) *
                textRadius;


            const textY =
                centerY +
                Math.sin(
                    textAngle
                ) *
                textRadius;


            let fontSize =
                26;


            if (
                values.length > 10
            ) {

                fontSize =
                    20;

            }


            if (
                values.length > 20
            ) {

                fontSize =
                    15;

            }


            if (
                values.length > 30
            ) {

                fontSize =
                    12;

            }


            let textRotation =
                textAngle;


            /*
               Keep text readable.
            */

            if (
                textRotation >
                    Math.PI / 2 &&
                textRotation <
                    Math.PI * 1.5
            ) {

                textRotation +=
                    Math.PI;

            }


            ctx.save();


            ctx.translate(
                textX,
                textY
            );


            ctx.rotate(
                textRotation
            );


            ctx.fillStyle =
                "white";


            ctx.font =
                `bold ${fontSize}px Arial`;


            ctx.textAlign =
                "center";


            ctx.textBaseline =
                "middle";


            let text =
                value;


            if (
                text.length > 18
            ) {

                text =
                    text.substring(
                        0,
                        18
                    ) + "…";

            }


            ctx.fillText(
                text,
                0,
                0
            );


            ctx.restore();

        }
    );


    /* Center */

    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        45,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#181818";

    ctx.fill();


    ctx.strokeStyle =
        "#666";

    ctx.lineWidth =
        4;

    ctx.stroke();

}


/* =========================================================
   Easing
========================================================= */

function easeOutCubic(t) {

    return 1 -
        Math.pow(
            1 - t,
            3
        );

}


/* =========================================================
   Spin wheel
========================================================= */

function spinWheel(
    ctx,
    values,
    duration
) {

    return new Promise(
        resolve => {


            const selectedIndex =
                Math.floor(
                    Math.random() *
                    values.length
                );


            const selectedValue =
                values[
                    selectedIndex
                ];


            const segmentAngle =
                (
                    Math.PI * 2
                ) /
                values.length;


            const pointerAngle =
                -Math.PI / 2;


            const selectedCenter =
                selectedIndex *
                segmentAngle +
                segmentAngle / 2;


            let finalRotation =
                pointerAngle -
                selectedCenter;


            finalRotation +=
                (
                    6 +
                    Math.floor(
                        Math.random() * 4
                    )
                ) *
                Math.PI *
                2;


            const startTime =
                performance.now();


            function animate(
                currentTime
            ) {

                const elapsed =
                    currentTime -
                    startTime;


                const progress =
                    Math.min(
                        elapsed /
                        duration,
                        1
                    );


                const rotation =
                    finalRotation *
                    easeOutCubic(
                        progress
                    );


                drawWheel(
                    ctx,
                    values,
                    rotation
                );


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        animate
                    );

                } else {

            }

        }

}

/* =========================================================
   Spin wheel to a predetermined value
========================================================= */

function spinWheelToValue(
    ctx,
    values,
    targetValue,
    duration
) {

    return new Promise(
        resolve => {

            const selectedIndex =
                values.indexOf(
                    targetValue
                );


            if (selectedIndex === -1) {
                resolve();
                return;
            }


            playSpinStartSound();

            const stopWheelSpinSound =
                startReelSpinSound(
                    duration
                );


            const fullTurn =
                Math.PI * 2;


            const segmentAngle =
                fullTurn /
                values.length;


            const pointerAngle =
                -Math.PI / 2;


            const selectedCenter =
                selectedIndex *
                    segmentAngle +
                segmentAngle / 2;


            const startRotation =
                ctx === ctx1
                    ? wheel1Rotation
                    : wheel2Rotation;


            const targetRotation =
                pointerAngle -
                selectedCenter;


            const alignment =
                (
                    (
                        targetRotation -
                        startRotation
                    ) % fullTurn +
                    fullTurn
                ) % fullTurn;


            const finalRotation =
                startRotation +
                (
                    5 +
                    Math.floor(
                        Math.random() * 3
                    )
                ) *
                    fullTurn +
                alignment;


            const startTime =
                performance.now();


            function animate(
                currentTime
            ) {

                const progress =
                    Math.min(
                        (
                            currentTime -
                            startTime
                        ) /
                            duration,
                        1
                    );


                const rotation =
                    startRotation +
                    (
                        finalRotation -
                        startRotation
                    ) *
                        easeOutCubic(
                            progress
                        );


                drawWheel(
                    ctx,
                    values,
                    rotation
                );


                if (progress < 1) {

                    requestAnimationFrame(
                        animate
                    );

                } else {

                    stopWheelSpinSound();
                    playReelStopSound();

                    resolve();

                }

            }


            requestAnimationFrame(
                animate
            );

        }
    );

}


/* =========================================================
   Audio, near miss and final lineup
========================================================= */

function getAudioContext() {

    if (!soundEnabled) {
        return null;
    }


    const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;


    if (!AudioContextClass) {
        return null;
    }


    if (!audioContext) {
        audioContext =
            new AudioContextClass();

        masterGainNode =
            audioContext.createGain();

        audioCompressorNode =
            audioContext.createDynamicsCompressor();


        audioCompressorNode.threshold.value =
            -14;

        audioCompressorNode.knee.value =
            18;

        audioCompressorNode.ratio.value =
            5;

        audioCompressorNode.attack.value =
            0.004;

        audioCompressorNode.release.value =
            0.16;

        masterGainNode.gain.value =
            soundEnabled
                ? masterVolume
                : 0;

        masterGainNode.connect(
            audioCompressorNode
        );

        audioCompressorNode.connect(
            audioContext.destination
        );
    }


    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }


    return audioContext;

}


function getVolumeFromPercent(
    percent
) {

    const normalized =
        Math.max(
            0,
            Math.min(
                100,
                Number(percent) || 0
            )
        ) / 100;


    return normalized *
        3.2;

}


function updateMasterVolume() {

    if (
        !audioContext ||
        !masterGainNode
    ) {
        return;
    }


    const now =
        audioContext.currentTime;

    const targetVolume =
        soundEnabled
            ? masterVolume
            : 0;


    masterGainNode.gain.cancelScheduledValues(
        now
    );

    masterGainNode.gain.setTargetAtTime(
        targetVolume,
        now,
        0.025
    );

}


function playTone(
    frequency,
    duration,
    volume = 0.045,
    delay = 0,
    type = "sine",
    endFrequency = frequency
) {

    const context =
        getAudioContext();


    if (!context) {
        return;
    }


    const startsAt =
        context.currentTime +
        delay;

    const oscillator =
        context.createOscillator();

    const gain =
        context.createGain();


    oscillator.type =
        type;

    oscillator.frequency.setValueAtTime(
        frequency,
        startsAt
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        Math.max(
            20,
            endFrequency
        ),
        startsAt + duration
    );


    gain.gain.setValueAtTime(
        0.0001,
        startsAt
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        startsAt + 0.015
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        startsAt + duration
    );


    oscillator.connect(gain);
    gain.connect(masterGainNode);

    oscillator.start(startsAt);
    oscillator.stop(
        startsAt +
        duration +
        0.03
    );

}


function playSpinClickNoise(
    progress
) {

    const context =
        getAudioContext();


    if (
        !context ||
        !masterGainNode
    ) {
        return;
    }


    if (!spinClickBuffer) {

        const sampleCount =
            Math.max(
                1,
                Math.floor(
                    context.sampleRate *
                    0.032
                )
            );


        spinClickBuffer =
            context.createBuffer(
                1,
                sampleCount,
                context.sampleRate
            );


        const samples =
            spinClickBuffer.getChannelData(
                0
            );


        for (
            let index = 0;
            index < sampleCount;
            index++
        ) {

            const decay =
                Math.pow(
                    1 -
                        index /
                        sampleCount,
                    3.4
                );

            samples[index] =
                (
                    Math.random() * 2 -
                    1
                ) * decay;

        }

    }


    const source =
        context.createBufferSource();

    const filter =
        context.createBiquadFilter();

    const gain =
        context.createGain();


    source.buffer =
        spinClickBuffer;

    filter.type =
        "bandpass";

    filter.frequency.value =
        2450 -
        progress * 1050;

    filter.Q.value =
        0.9;

    gain.gain.value =
        0.032;


    source.connect(filter);
    filter.connect(gain);
    gain.connect(masterGainNode);

    source.start();

}


function playSpinStartSound() {

    const now =
        performance.now();


    if (
        now - lastSpinSoundAt <
        120
    ) {
        return;
    }


    lastSpinSoundAt =
        now;

    playTone(
        115,
        0.16,
        0.025,
        0,
        "square",
        165
    );

    playTone(
        185,
        0.12,
        0.018,
        0.08,
        "triangle",
        245
    );

}


function startReelSpinSound(
    duration
) {

    const context =
        getAudioContext();


    if (
        !context ||
        !masterGainNode
    ) {
        return () => {};
    }


    const now =
        performance.now();


    if (!sharedSpinSound) {

        const state = {
            activeCount: 0,
            startedAt: now,
            endsAt: now + duration,
            timer: null
        };


        sharedSpinSound =
            state;


        function playCaseTick() {

            if (
                sharedSpinSound !== state ||
                state.activeCount <= 0
            ) {
                return;
            }


            const currentTime =
                performance.now();

            const totalTime =
                Math.max(
                    1,
                    state.endsAt -
                        state.startedAt
                );

            const progress =
                Math.max(
                    0,
                    Math.min(
                        1,
                        (
                            currentTime -
                            state.startedAt
                        ) / totalTime
                    )
                );

            const highClick =
                1120 -
                progress * 560 +
                Math.random() * 85;

            const lowClick =
                210 -
                progress * 95 +
                Math.random() * 18;


            playSpinClickNoise(
                progress
            );

            playTone(
                highClick,
                0.022,
                0.019,
                0,
                "square",
                highClick * 0.44
            );

            playTone(
                lowClick,
                0.038,
                0.018,
                0,
                "triangle",
                lowClick * 0.62
            );


            const slowdown =
                Math.pow(
                    progress,
                    3.25
                );

            const nextTickDelay =
                42 +
                slowdown * 270 +
                Math.random() *
                    (
                        7 +
                        progress * 18
                    );


            state.timer =
                setTimeout(
                    playCaseTick,
                    nextTickDelay
                );

        }


        state.timer =
            setTimeout(
                playCaseTick,
                18
            );

    } else {

        sharedSpinSound.endsAt =
            Math.max(
                sharedSpinSound.endsAt,
                now + duration
            );

    }


    const state =
        sharedSpinSound;

    state.activeCount++;


    let stopped =
        false;


    const stop = () => {

        if (stopped) {
            return;
        }


        stopped = true;

        state.activeCount =
            Math.max(
                0,
                state.activeCount - 1
            );


        if (
            state.activeCount === 0 &&
            sharedSpinSound === state
        ) {

            clearTimeout(
                state.timer
            );

            sharedSpinSound =
                null;

        }

    };


    setTimeout(
        stop,
        duration + 220
    );


    return stop;

}

async function copyTeamReady(
    feedbackButton = teamReadyCopy
) {

    if (
        currentTeamReadyDraft.length ===
        0
    ) {
        return;
    }


    const rosterText =
        currentTeamReadyDraft
        .map(
            (
                item,
                index
            ) =>
                `${index + 1} - ` +
                `${item.player} - ` +
                `${item.agent} - ` +
                `${item.role}`
        )
        .join("\n");


    const roleAssignments =
        currentTeamReadyMeta
            ? currentTeamReadyMeta.assignments.filter(
                assignment =>
                    assignment.type !== "rule"
            )
            : [];

    const gameRules =
        currentTeamReadyMeta
            ? currentTeamReadyMeta.assignments.filter(
                assignment =>
                    assignment.type === "rule"
            )
            : [];

    const assignmentText =
        roleAssignments
            .map(
                assignment => {

                    const heading =
                        `${assignment.label} - ` +
                        assignment.value;

                    return assignment.description
                        ? `${heading}\n${assignment.description}`
                        : heading;

                }
            )
            .join("\n");

    const rulesText =
        gameRules.length
            ? (
                currentTeamReadyMeta.chaosMatch
                    ? "ХАОС-МАТЧ — Правила на игру:\n"
                    : "Правила на игру:\n"
              ) +
                gameRules
                    .map(
                        rule =>
                            rule.value
                    )
                    .join("\n")
            : "";


    const headerText =
        currentTeamReadyMeta
            ? `TEAM ${currentTeamReadyMeta.teamNumber} - ${currentTeamReadyMeta.date}`
            : `TEAM - ${getTeamReadyDate()}`;


    const text =
        `${headerText}\n` +
        `${rosterText}\n\n` +
        `${assignmentText}\n\n` +
        rulesText;


    try {

        await navigator.clipboard.writeText(
            text
        );

    } catch {

        const textArea =
            document.createElement(
                "textarea"
            );

        textArea.value =
            text;

        textArea.style.position =
            "fixed";

        textArea.style.opacity =
            "0";

        document.body.appendChild(
            textArea
        );

        textArea.select();

        document.execCommand(
            "copy"
        );

        textArea.remove();

    }


    const oldText =
        feedbackButton.textContent;

    feedbackButton.textContent =
        "COPIED!";


    setTimeout(
        () => {

            feedbackButton.textContent =
                oldText;

        },
        1200
    );

}

async function playNearMissTease(
    reel
) {

    if (!reel) {
        return;
    }


    const targetCell =
        reel.querySelector(
            ".casino-target-cell"
        );


    if (!targetCell) {
        return;
    }


    const nearSignatureCells = [
        targetCell.previousElementSibling,
        targetCell.nextElementSibling
    ].filter(
        cell =>
            cell &&
            cell.classList.contains(
                "signature-cell"
            )
    );


    if (
        nearSignatureCells.length ===
        0
    ) {
        return;
    }


    nearSignatureCells.forEach(
        cell =>
            cell.classList.add(
                "near-miss-flash"
            )
    );

    reel.classList.add(
        "near-miss-reel"
    );

    document.body.classList.add(
        "near-miss-shake"
    );

    playNearMissSound();


    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                680
            )
    );


    nearSignatureCells.forEach(
        cell =>
            cell.classList.remove(
                "near-miss-flash"
            )
    );

    reel.classList.remove(
        "near-miss-reel"
    );

    document.body.classList.remove(
        "near-miss-shake"
    );

}

function getCasinoContext(
    reel
) {

    return reel === casinoReel1

function getStableValueHash(
    value
) {

    let hash = 2166136261;


    for (
        let index = 0;
        index < value.length;
        index++
    ) {

        hash ^=
            value.charCodeAt(
                index
            );

        hash =
            Math.imul(
                hash,
                16777619
            );

    }


    return hash >>> 0;

}


function getCasinoCellColor(
    reel,
    value
) {

    const hash =
        getStableValueHash(
            value
        );


    if (
        wheelDesignMode ===
        "grayscale"
    ) {

        return `hsl(
            0,
            0%,
            ${32 + hash % 25}%
        )`;

    }


    if (
        wheelDesignMode ===
        "players"
    ) {

        return getWheelSegmentStyle(
            getCasinoContext(
                reel
            ),
            value,
            hash % 2,
            2
        );

    }


    return `hsl(
        ${hash % 360},
        68%,
        ${38 + (hash >>> 8) % 12}%
    )`;

}

    const displayValues = [

                safeValues.length

    const strip =

function spinTeamPlayerLabel(
    label,
    values,
    targetValue,
    duration
) {

    return new Promise(
        resolve => {

            const safeValues =
                values.length > 0
                    ? values
                    : [targetValue];


            const cellHeight =
                38;

            const restingOffset =
                Math.max(
                    0,
                    Math.round(
                        (
                            label.clientHeight -
                            cellHeight
                        ) /
                        2
                    )
                );


            const stepCount =
                Math.max(
                    18,
                    Math.round(
                        duration / 82
                    )
                );


            const spinValues = [];

            let previousValue =
                label.dataset.currentValue ||
                "";


            for (
                let index = 0;
                index < stepCount;
                index++
            ) {

                const alternatives =
                    safeValues.filter(
                        value =>
                            value !==
                                previousValue
                    );

                const source =
                    alternatives.length > 0
                        ? alternatives
                        : safeValues;

                const value =
                    source[
                        Math.floor(
                            Math.random() *
                            source.length
                        )
                    ];


                spinValues.push(
                    value
                );

                previousValue =
                    value;

            }


            spinValues.push(
                targetValue
            );


            let strip =
                label.querySelector(
                    ".team-player-strip"
                );


            if (!strip) {

                strip =
                    document.createElement(
                        "div"
                    );

                strip.className =
                    "team-player-strip";

                label.replaceChildren(
                    strip
                );

            }


            const createPlayerCell =
                value => {

                    const cell =
                        document.createElement(
                            "div"
                        );

                    cell.className =
                        "team-player-cell";

                    cell.textContent =
                        value;

                    cell.style.setProperty(
                        "--player-color",
                        getPlayerDesignColor(
                            value
                        ) || "#3d3d3d"
                    );


                    return cell;

                };


            strip.replaceChildren(
                ...spinValues.map(
                    createPlayerCell
                )
            );

            strip.style.transition =
                "none";

            strip.style.transform =
                `translateY(${restingOffset}px)`;


            label.classList.remove(
                "settled"
            );

            label.classList.add(
                "spinning"
            );


            let finished =
                false;


            const finish = () => {

                if (finished) {
                    return;
                }


                finished =
                    true;

                label.dataset.currentValue =
                    targetValue;

                strip.style.transition =
                    "none";

                strip.style.transform =
                    `translateY(${restingOffset}px)`;

                strip.replaceChildren(
                    createPlayerCell(
                        targetValue
                    )
                );

                label.classList.remove(
                    "spinning"
                );

                label.classList.add(
                    "settled"
                );


                setTimeout(
                    () =>
                        label.classList.remove(
                            "settled"
                        ),
                    460
                );


                resolve();

            };


            const handleTransitionEnd =
                event => {

                    if (
                        event.target === strip &&
                        event.propertyName ===
                            "transform"
                    ) {

                        finish();

                    }

                };


            strip.addEventListener(
                "transitionend",
                handleTransitionEnd,
                { once: true }
            );


            void strip.offsetWidth;


            requestAnimationFrame(
                () => {

                    strip.style.transition =
                        `transform ${duration}ms cubic-bezier(0.12, 0.58, 0.08, 1)`;

                    strip.style.transform =
                        `translateY(${restingOffset - stepCount * cellHeight}px)`;

                }
            );


            setTimeout(
                finish,
                duration + 250
            );

        }
    );

}

function spinCasinoReel(
    reel,
    values,
    targetValue,
    duration,
    dramaticFinish = false
) {

    playSpinStartSound();

    const stopReelSpinSound =
        startReelSpinSound(
            duration
        );

    return new Promise(
        resolve => {

            const safeValues =
                values.length > 0
                    ? values
                    : [targetValue];


            const randomValue = () =>
                safeValues[
                    Math.floor(
                        Math.random() *
                        safeValues.length
                    )
                ];


            const stepCount =
                Math.max(
                    36,
                    Math.round(
                        duration / 65
                    )
                );


            const spinValues = [
                randomValue(),
                randomValue()
            ];


            for (
                let i = 0;
                i < stepCount;
                i++
            ) {

                spinValues.push(
                    randomValue()
                );

            }


            spinValues.push(
                targetValue,
                randomValue()
            );


            const targetIndex =
                spinValues.length - 2;


            const strip =
                reel.querySelector(
                    ".casino-reel-strip"
                );


            strip.replaceChildren(
                ...spinValues.map(
                    (value, index) =>
                        createCasinoCell(
                            reel,
                            value,
                            index,
                            spinValues.length,
                            index === targetIndex
                        )
                )
            );


            strip.style.transition =
                "none";

            strip.style.transform =
                "translateY(21px)";


            void strip.offsetHeight;


            let finished = false;

            let dramaticAnimationFrame =
                null;


            const handleTransitionEnd =
                event => {

                    if (
                        event.propertyName ===
                            "transform"
                    ) {

                        finish();

                    }

                };


            function finish() {

                if (finished) {
                    return;
                }


                finished = true;


                if (
                    dramaticAnimationFrame !==
                    null
                ) {

                    cancelAnimationFrame(
                        dramaticAnimationFrame
                    );

                }

                strip.removeEventListener(
                    "transitionend",
                    handleTransitionEnd
                );

                reel.classList.remove(
                    "dramatic-slow-motion"
                );

                reel.dataset.currentValue =
                    targetValue;


                stopReelSpinSound();

                playReelStopSound();


                const player =
                    reel.dataset.player ||
                    "";


                const nearSignatureMiss =
                    Boolean(
                        player &&
                        !isSignatureAgentForPlayer(
                            player,
                            targetValue
                        ) &&
                        [
                            spinValues[
                                targetIndex - 1
                            ],
                            spinValues[
                                targetIndex + 1
                            ]
                        ].some(
                            value =>
                                isSignatureAgentForPlayer(
                                    player,
                                    value
                                )
                        )
                    );


                resolve({
                    nearSignatureMiss
                });

            }


            if (dramaticFinish) {

                const slowMotionDuration =
                    Math.min(
                        3800,
                        Math.max(
                            2400,
                            duration * 0.3
                        )
                    );

                const fastPhaseDuration =
                    Math.max(
                        500,
                        duration -
                            slowMotionDuration
                    );

                const slowMotionStartIndex =
                    Math.max(
                        0,
                        targetIndex - 4
                    );

                const startY =
                    21;

                const slowMotionStartY =
                    107 -
                    slowMotionStartIndex * 86;

                const finalY =
                    107 -
                    targetIndex * 86;

                const fastDistance =
                    startY -
                    slowMotionStartY;

                const slowDistance =
                    slowMotionStartY -
                    finalY;

                const totalDistance =
                    fastDistance +
                    slowDistance;

                const boundaryVelocity =
                    2 * slowDistance /
                    slowMotionDuration;

                const initialVelocity =
                    Math.max(
                        boundaryVelocity,
                        2 * fastDistance /
                            fastPhaseDuration -
                            boundaryVelocity
                    );


                function hermitePosition(
                    startPosition,
                    endPosition,
                    startVelocity,
                    endVelocity,
                    elapsed,
                    segmentDuration
                ) {

                    const progress =
                        Math.max(
                            0,
                            Math.min(
                                1,
                                elapsed /
                                    segmentDuration
                            )
                        );

                    const progressSquared =
                        progress * progress;

                    const progressCubed =
                        progressSquared * progress;


                    return (
                        (
                            2 * progressCubed -
                            3 * progressSquared +
                            1
                        ) * startPosition +
                        (
                            progressCubed -
                            2 * progressSquared +
                            progress
                        ) * startVelocity *
                            segmentDuration +
                        (
                            -2 * progressCubed +
                            3 * progressSquared
                        ) * endPosition +
                        (
                            progressCubed -
                            progressSquared
                        ) * endVelocity *
                            segmentDuration
                    );

                }


                reel.classList.add(
                    "dramatic-slow-motion"
                );

                strip.style.transition =
                    "none";


                const animationStartedAt =
                    performance.now();


                function animateDramaticSpin(
                    currentTime
                ) {

                    if (finished) {
                        return;
                    }


                    const elapsed =
                        Math.min(
                            duration,
                            currentTime -
                                animationStartedAt
                        );

                    let travelledDistance;


                    if (
                        elapsed <=
                        fastPhaseDuration
                    ) {

                        travelledDistance =
                            hermitePosition(
                                0,
                                fastDistance,
                                initialVelocity,
                                boundaryVelocity,
                                elapsed,
                                fastPhaseDuration
                            );

                    } else {

                        travelledDistance =
                            hermitePosition(
                                fastDistance,
                                totalDistance,
                                boundaryVelocity,
                                0,
                                elapsed -
                                    fastPhaseDuration,
                                slowMotionDuration
                            );

                    }


                    strip.style.transform =
                        `translateY(${
                            startY -
                            travelledDistance
                        }px)`;


                    if (elapsed < duration) {

                        dramaticAnimationFrame =
                            requestAnimationFrame(
                                animateDramaticSpin
                            );

                    } else {

                        strip.style.transform =
                            `translateY(${finalY}px)`;

                        finish();

                    }

                }


                dramaticAnimationFrame =
                    requestAnimationFrame(
                        animateDramaticSpin
                    );

            } else {

                strip.addEventListener(
                    "transitionend",
                    handleTransitionEnd
                );

                requestAnimationFrame(
                    () => {

                        strip.style.transition =
                            `transform ${duration}ms ` +
                            "cubic-bezier(0.12, 0.58, 0.08, 1)";

                        strip.style.transform =
                            `translateY(${
                                107 -
                                targetIndex * 86
                            }px)`;

                    }
                );

            }


            setTimeout(
                finish,
                duration + 500
            );

        }
    );

}


function spinDisplayToValue(
    ctx,
    reel,
    values,
    targetValue,
    duration
) {

    if (
        spinDisplayMode ===

    return spinWheelToValue(

        duration
    );

}

) {

        isSignatureAgentForPlayer(
            player,

        );


    if (
        personalLabel &&

    if (
        personalLabel &&
        Math.random() < 0.5
    ) {

        return signatureHit
            ? `${personalLabel} x${multiplier}`
            : personalLabel;

    }


    return getRandomCelebrationText(
        SIGNATURE_HIT_LABELS,
        multiplier
    );

                );

/* =========================================================

function updateResultNumbers() {

        );


    rows.forEach(
        (
            row,
            index
        ) => {


            const text =
                row.querySelector(

                );


            row.classList.toggle(

                    `${row.dataset.role}`;

            } else {

                text.textContent =

                    `${row.dataset.value1} - ` +
                    `${row.dataset.value2}`;

            }

        }
    );

}

function rerollSignatureRow(
    row
) {

    const player =
        row.dataset.value1;


    const usedAgents =
        new Set(
            getUsedAgents(
                row
            )
        );


    let availableSignatures =
        getSignatureAgents(
            player
        )
        .filter(
            agent =>
                !usedAgents.has(
                    agent
                )
        );


    const differentSignatures =
        availableSignatures.filter(
            agent =>
                agent !==
                row.dataset.value2
        );


    if (
        differentSignatures.length > 0
    ) {

        availableSignatures =
            differentSignatures;

    }


    if (
        availableSignatures.length === 0
    ) {

        alert(
            "No unique signature agent is available for this player."
        );

        return;

    }


    const newAgent =
        availableSignatures[
            Math.floor(
                Math.random() *
                availableSignatures.length
            )
        ];


    row.dataset.value2 =
        newAgent;

    row.dataset.role =
        getRoleForAgent(
            newAgent
        );

    row.dataset.type =
        "role";


    updateResultNumbers();


    showSignatureCelebration(
        getSignatureCelebrationText(
            player,
            newAgent,
            1
        )
    );

}


/* =========================================================
   Normal row reroll
========================================================= */

function rerollNormalRow(
    row
) {

    const usedAgents =
        getUsedAgents(
            row
        );


    function getAvailableAgents() {

        const candidates =
            wheel2Values.filter(
                value =>
                    !usedAgents.includes(
                        value
                    ) &&
                    canAssignAgentToPlayer(
                        row.dataset.value1,
                        value
                    )
            );


        const different =
            candidates.filter(
                value =>
                    value !==
                    row.dataset.value2
            );


        return different.length > 0
            ? different
            : candidates;

    }


    let available =
        getAvailableAgents();


    if (available.length === 0) {

        resetAgentMemory();

        available =
            getAvailableAgents();

    }


    if (
        available.length === 0
    ) {

        return;

    }


    const newAgent =
        available[
            Math.floor(
                Math.random() *
                available.length
            )
        ];


    row.dataset.value2 =
        newAgent;


    rememberAgentForPlayer(
        row.dataset.value1,
        newAgent
    );


    updateResultNumbers();


}

function getRoleForAgent(
    agent
) {

    for (
        const role in
        VALORANT_ROLES
    ) {

        if (
            VALORANT_ROLES[
                role
            ].includes(
                agent
            )
        ) {

            return role;

        }

    }


    return null;

}

   Get agents for role
========================================================= */

function getAgentsForRole(
    role
) {

    return [
        ...VALORANT_ROLES[
            role
        ]
    ];

}


/* =========================================================
   ROLE DRAFT
========================================================= */

function roleDraft() {

    updateValues();


    const playerCount =
        Math.min(
            wheel1Values.length,
            5
        );


    if (
        playerCount === 0
    ) {

        alert(
            "Select at least one player."
        );

        return;

    }


    if (
        ALL_AGENTS.length < playerCount
    ) {

        alert(
            "Not enough agents."
        );

        return;

    }


    const baseRoles = [

        "Duelist",
        "Initiator",
        "Controller",
        "Sentinel"

    ];


    const roles =
        shuffleArray(
            baseRoles
        )
        .slice(
            0,
            Math.min(
                playerCount,
                baseRoles.length
            )
        );


    while (
        roles.length < playerCount
    ) {

        roles.push(
            baseRoles[
                Math.floor(
                    Math.random() *
                    baseRoles.length
                )
            ]
        );

    }


    const assignedRoles =
        shuffleArray(
            roles
        );

    const players =
        shuffleArray(
            wheel1Values
        )
        .slice(
            0,
            playerCount
        );


    const usedAgents =
        new Set();


    const playerAgents =
        new Array(
            playerCount
        ).fill(null);


    function assignRoleDraftAgent(
        position
    ) {

        if (
            position ===
            playerCount
        ) {
            return true;
        }


        const availableAgents =
            shuffleArray(
                getAgentsForRole(
                    assignedRoles[position]
                )
                .filter(
                    agent =>
                        !usedAgents.has(
                            agent
                        ) &&
                        canAssignAgentToPlayer(
                            players[position],
                            agent
                        )
                )
            );


        for (
            const agent of
            availableAgents
        ) {

            playerAgents[position] =
                agent;

            usedAgents.add(
                agent
            );


            if (
                assignRoleDraftAgent(
                    position + 1
                )
            ) {

                return true;

            }


            usedAgents.delete(
                agent
            );

            playerAgents[position] =
                null;

        }


        return false;

    }


    let roleDraftIsValid =
        assignRoleDraftAgent(0);


    if (!roleDraftIsValid) {

        resetAgentMemory();

        roleDraftIsValid =
            assignRoleDraftAgent(0);

    }


    if (!roleDraftIsValid) {

        alert(
            "Unable to create a valid role draft."
        );

        return;

    }


    saveUndoState();


    for (
        let i = 0;
        i < playerCount;
        i++
    ) {

        addResult(
            players[i],
            playerAgents[i],
            false,
            assignedRoles[i],
            "role"
        );

    }

}
