const SIGNATURE_AGENTS = {

    "славик": ["Iso", "Jett", "Neon", "Phoenix", "Reyna", "Veto", "Waylay", "Yoru"],
    "мишок": ["Yoru", "Cypher"],
    "вадик": ["Clove", "Jett", "Fade"],
    "ромик": ["Killjoy", "Harbor", "Sage"],
    "диана": ["Killjoy", "Miks", "Sage"]

};


const nonSignatureAgentMemory =
    new Map();


function resetAgentMemory() {

    nonSignatureAgentMemory.clear();

}


function getSignatureAgents(
    player
) {

    return SIGNATURE_AGENTS[
        player.trim().toLowerCase()
    ] || [];

}


function getPlayerMemoryKey(
    player
) {

    return player
        .trim()
        .toLowerCase();

}


function isSignatureAgentForPlayer(
    player,
    agent
) {

    return getSignatureAgents(
        player
    ).includes(
        agent
    );

}


function canAssignAgentToPlayer(
    player,
    agent
) {

    if (
        isSignatureAgentForPlayer(
            player,
            agent
        )
    ) {

        return true;

    }


    const rememberedAgents =
        nonSignatureAgentMemory.get(
            getPlayerMemoryKey(
                player
            )
        );


    return !rememberedAgents ||
        !rememberedAgents.has(
            agent
        );

}


function rememberAgentForPlayer(
    player,
    agent
) {

    if (
        !player ||
        !agent ||
        isSignatureAgentForPlayer(
            player,
            agent
        )
    ) {

        return;

    }


    const playerKey =
        getPlayerMemoryKey(
            player
        );


    if (
        !nonSignatureAgentMemory.has(
            playerKey
        )
    ) {

        nonSignatureAgentMemory.set(
            playerKey,
            new Set()
        );

    }


    nonSignatureAgentMemory.get(
        playerKey
    ).add(
        agent
    );

}


function roleDraftSignature(
    replaceResults = false,
    animated = false
) {

    if (isRolling) {
        return;
    }

    updateValues();


    const playerCount =
        Math.min(
            wheel1Values.length,
            5
        );


    if (
        playerCount === 0
    ) {

        alert(
            "Select at least one player."
        );

        return;

    }


    const baseRoles = [

        "Duelist",
        "Initiator",
        "Controller",
        "Sentinel"

    ];


    const players =
        shuffleArray(
            wheel1Values
        )
        .slice(
            0,
            playerCount
        );


    const eligibleIndexes =
        players
        .map(
            (player, index) =>
                getSignatureAgents(player).length > 0
                    ? index
                    : -1
        )
        .filter(
            index =>
                index !== -1
        );


    if (
        eligibleIndexes.length === 0
    ) {

        alert(
            "No players with signature agents were found."
        );

        return;

    }


    const shuffledEligibleIndexes =
        shuffleArray(
            eligibleIndexes
        );


    const signatureChanceRoll =
        Math.random();


    const signatureTargetCount =
        signatureChanceRoll < 0.001
            ? 5
            : signatureChanceRoll < 0.01
                ? 4
                : signatureChanceRoll < 0.10
                    ? 3
                    : signatureChanceRoll < 0.35
                        ? 2
                        : 1;


    const signatureIndexes =
        shuffledEligibleIndexes.slice(
            0,
            Math.min(
                signatureTargetCount,
                shuffledEligibleIndexes.length
            )
        );


    const signatureAssignments =
        new Map();


    const reservedAgents =
        new Set();


    function signatureRolesCanFitDraft() {

        const roleCounts = {};


        signatureAssignments.forEach(
            agent => {

                const role =
                    getRoleForAgent(
                        agent
                    );


                roleCounts[role] =
                    (
                        roleCounts[role] ||
                        0
                    ) + 1;

            }
        );


        if (
            Object.values(
                roleCounts
            )
            .some(
                count => count > 2
            )
        ) {

            return false;

        }


        const duplicatedRoles =
            Object.values(
                roleCounts
            )
            .filter(
                count => count === 2
            )
            .length;


        if (duplicatedRoles > 1) {
            return false;
        }


        return (
            signatureAssignments.size <=
            playerCount
        );

    }


    function selectSignatures(
        position
    ) {

        if (
            position ===
            signatureIndexes.length
        ) {

            return signatureRolesCanFitDraft();

        }


        const index =
            signatureIndexes[position];


        const availableSignatures =
            shuffleArray(
                getSignatureAgents(
                    players[index]
                )
                .filter(
                    agent =>
                        !reservedAgents.has(
                            agent
                        )
                )
            );


        for (
            const agent of
            availableSignatures
        ) {

            signatureAssignments.set(
                index,
                agent
            );

            reservedAgents.add(
                agent
            );


            if (
                signatureRolesCanFitDraft() &&
                selectSignatures(
                    position + 1
                )
            ) {

                return true;

            }


            signatureAssignments.delete(
                index
            );

            reservedAgents.delete(
                agent
            );

        }


        return false;

    }


    const signatureSelectionIsValid =
        selectSignatures(0);


    if (!signatureSelectionIsValid) {

        alert(
            "Unable to select unique signature agents."
        );

        return;

    }


    const signatureRoleCounts = {};


    signatureAssignments.forEach(
        agent => {

            const role =
                getRoleForAgent(
                    agent
                );


            signatureRoleCounts[role] =
                (
                    signatureRoleCounts[role] ||
                    0
                ) + 1;

        }
    );


    const rolePool = [];


    signatureAssignments.forEach(
        agent =>
            rolePool.push(
                getRoleForAgent(
                    agent
                )
            )
    );


    const missingRoles =
        shuffleArray(
            baseRoles.filter(
                role =>
                    !signatureRoleCounts[
                        role
                    ]
            )
        );


    while (
        rolePool.length < playerCount &&
        missingRoles.length > 0
    ) {

        rolePool.push(
            missingRoles.shift()
        );

    }


    while (
        rolePool.length < playerCount
    ) {

        const roleCounts =
            rolePool.reduce(
                (counts, role) => {

                    counts[role] =
                        (counts[role] || 0) + 1;

                    return counts;

                },
                {}
            );

        const hasDuplicate =
            Object.values(
                roleCounts
            )
            .some(
                count => count >= 2
            );

        const availableRoles =
            baseRoles.filter(
                role =>
                    !roleCounts[role] ||
                    (
                        !hasDuplicate &&
                        roleCounts[role] === 1
                    )
            );


        rolePool.push(
            availableRoles[
                Math.floor(
                    Math.random() *
                    availableRoles.length
                )
            ]
        );

    }


    const remainingRoles =
        shuffleArray(
            rolePool
        );


    const playerRoles =
        new Array(
            playerCount
        ).fill(null);


    const playerAgents =
        new Array(
            playerCount
        ).fill(null);


    const usedAgents =
        new Set(
            reservedAgents
        );


    let forcedRolesAreValid =
        true;


    signatureAssignments.forEach(
        (agent, index) => {

            const role =
                getRoleForAgent(
                    agent
                );


            const roleIndex =
                remainingRoles.indexOf(
                    role
                );


            if (roleIndex === -1) {

                forcedRolesAreValid =
                    false;

                return;

            }


            playerRoles[index] = role;

            playerAgents[index] = agent;


            remainingRoles.splice(
                roleIndex,
                1
            );

        }
    );


    if (!forcedRolesAreValid) {

        alert(
            "Unable to preserve the role composition."
        );

        return;

    }


    const openPlayerIndexes =
        shuffleArray(
            players
            .map(
                (player, index) =>
                    index
            )
            .filter(
                index =>
                    !signatureAssignments.has(
                        index
                    )
            )
        );


    function completeDraft(
        position
    ) {

        if (
            position ===
            openPlayerIndexes.length
        ) {

            return true;

        }


        const playerIndex =
            openPlayerIndexes[position];


        const playerSignatures =
            getSignatureAgents(
                players[playerIndex]
            );


        const candidateRoles =
            shuffleArray([
                ...new Set(
                    remainingRoles
                )
            ]);


        for (
            const role of
            candidateRoles
        ) {

            const roleIndex =
                remainingRoles.indexOf(
                    role
                );


            remainingRoles.splice(
                roleIndex,
                1
            );


            const availableAgents =
                shuffleArray(
                    getAgentsForRole(
                        role
                    )
                    .filter(
                        candidate =>
                            !usedAgents.has(
                                candidate
                            ) &&
                            !playerSignatures.includes(
                                candidate
                            ) &&
                            canAssignAgentToPlayer(
                                players[playerIndex],
                                candidate
                            )
                    )
                );


            for (
                const agent of
                availableAgents
            ) {

                playerRoles[playerIndex] =
                    role;

                playerAgents[playerIndex] =
                    agent;

                usedAgents.add(
                    agent
                );


                if (
                    completeDraft(
                        position + 1
                    )
                ) {

                    return true;

                }


                usedAgents.delete(
                    agent
                );

                playerRoles[playerIndex] =
                    null;

                playerAgents[playerIndex] =
                    null;

            }


            remainingRoles.splice(
                roleIndex,
                0,
                role
            );

        }


        return false;

    }


    let completeDraftIsValid =
        completeDraft(0);


    if (!completeDraftIsValid) {

        resetAgentMemory();

        completeDraftIsValid =
            completeDraft(0);

    }


    if (!completeDraftIsValid) {

        alert(
            "Unable to create a valid role draft."
        );

        return;

    }


    saveUndoState();


    if (replaceResults) {
        clearResults();
    }


    const draft =
        players.map(
            (player, index) => ({

                player,

                agent:
                    playerAgents[index],

                role:
                    playerRoles[index]

            })
        );


    if (animated) {

        draft.forEach(
            item => {

                rememberAgentForPlayer(
                    item.player,
                    item.agent
                );

            }
        );


        animateSignatureDraft(
            draft
        );

        return;

    }


    for (
        let i = 0;
        i < draft.length;
        i++
    ) {

        addResult(
            draft[i].player,
            draft[i].agent,
            false,
            draft[i].role,
            "role"
        );

    }

}


/* =========================================================

========================================================= */

function onlySignatureDraft() {

    if (isRolling) {
        return;
    }


    updateValues();


    const players =
        wheel1Values.slice(
            0,
            5
        );


    if (players.length === 0) {

        alert(
            "Select at least one player."
        );

        return;

    }


    const playersWithoutSignatures =
        players.filter(
            player =>
                getSignatureAgents(
                    player
                ).length === 0
        );


    if (
        playersWithoutSignatures.length > 0
    ) {

        alert(
            "No signature agents for: " +
            playersWithoutSignatures.join(
                ", "
            )
        );

        return;

    }


    const assignedAgents =
        new Array(
            players.length
        ).fill(null);


    const usedAgents =
        new Set();


    const assignmentOrder =
        players
        .map(
            (player, index) => ({
                index,
                optionCount:
                    getSignatureAgents(
                        player
                    ).length,
                randomTie:
                    Math.random()
            })
        )
        .sort(
            (first, second) =>
                first.optionCount -
                    second.optionCount ||
                first.randomTie -
                    second.randomTie
        )
        .map(
            item =>
                item.index
        );


    function assignSignature(
        position
    ) {

        if (
            position ===
            assignmentOrder.length
        ) {

            return true;

        }


        const playerIndex =
            assignmentOrder[
                position
            ];


        const candidates =
            shuffleArray(
                getSignatureAgents(
                    players[playerIndex]
                )
            )
            .filter(
                agent =>
                    !usedAgents.has(
                        agent
                    )
            );


        for (
            const agent of
            candidates
        ) {

            assignedAgents[
                playerIndex
            ] = agent;

            usedAgents.add(
                agent
            );


            if (
                assignSignature(
                    position + 1
                )
            ) {

                return true;

            }


            usedAgents.delete(
                agent
            );

            assignedAgents[
                playerIndex
            ] = null;

        }


        return false;

    }


    if (!assignSignature(0)) {

        alert(
            "Unable to select unique signature agents."
        );

        return;

    }


    const draft =
        players.map(
            (player, index) => ({

                player,

                agent:
                    assignedAgents[index],

                role:
                    getRoleForAgent(
                        assignedAgents[index]
                    )

            })
        );


    saveUndoState();

    clearResults();

    animateSignatureDraft(
        draft
    );

}

    row
) {

    const role =
        row.dataset.role;


    if (!role) {
        return;
    }


    /*
       Get all agents currently used
       by other role rows.
    */

    const usedAgents =
        new Set();


    Array.from(
        results.querySelectorAll(
            ".result-row"
        )
    )
    .forEach(
        otherRow => {

            if (
                otherRow ===
                row
            ) {

                return;

            }


            if (
                otherRow.dataset.type !==
                "role"
            ) {

                return;

            }


            usedAgents.add(
                otherRow.dataset.value2
            );

        }
    );


    /*
       Available agents must belong
       to the same role.
    */

    let availableAgents =
        getAgentsForRole(
            role
        )
        .filter(
            agent =>
                !usedAgents.has(
                    agent
                )
        );


    /*
       Avoid the current agent.
    */

    const differentAgents =
        availableAgents.filter(
            agent =>
                agent !==
                row.dataset.value2
        );


    if (
        differentAgents.length > 0
    ) {

        availableAgents =
            differentAgents;

    }


    if (
        availableAgents.length === 0
    ) {

        return;

    }


    /*
       Pick a new unique agent.
    */

    let newAgent =
        availableAgents[
            Math.floor(
                Math.random() *
                availableAgents.length
            )
        ];


    /*
       Get players used by other
       ROLE DRAFT rows.
    */

    const usedPlayers =
        new Set();


    Array.from(
        results.querySelectorAll(
            ".result-row"
        )
    )
    .forEach(
        otherRow => {

            if (
                otherRow ===
                row
            ) {

                return;

            }


            if (
                otherRow.dataset.type !==
                "role"
            ) {

                return;

            }


            usedPlayers.add(
                otherRow.dataset.value1
            );

        }
    );


    let availablePlayers =
        wheel1Values.filter(
            player =>
                !usedPlayers.has(
                    player
                )
        );


    /*
       Avoid current player.
    */

    const differentPlayers =
        availablePlayers.filter(
            player =>
                player !==
                row.dataset.value1
        );


    if (
        differentPlayers.length > 0
    ) {

        availablePlayers =
            differentPlayers;

    }


    if (
        availablePlayers.length === 0
    ) {

        return;

    }


    const newPlayer =
        availablePlayers[
            Math.floor(
                Math.random() *
                availablePlayers.length
            )
        ];


    let compatibleAgents =
        availableAgents.filter(
            agent =>
                canAssignAgentToPlayer(
                    newPlayer,
                    agent
                )
        );


    if (
        compatibleAgents.length === 0
    ) {

        resetAgentMemory();

        compatibleAgents =
            availableAgents.filter(
                agent =>
                    canAssignAgentToPlayer(
                        newPlayer,
                        agent
                    )
            );

    }


    if (
        compatibleAgents.length === 0
    ) {

        return;

    }


    newAgent =
        compatibleAgents[
            Math.floor(
                Math.random() *
                compatibleAgents.length
            )
        ];


    row.dataset.value1 =
        newPlayer;


    row.dataset.value2 =
        newAgent;


    rememberAgentForPlayer(
        newPlayer,
        newAgent
    );


    updateResultNumbers();


}


/* =========================================================
   Main ROLL
========================================================= */

async function roll() {

    if (isRolling) {
        return;
    }


    updateValues();


    if (
        wheel1Values.length === 0 ||
        wheel2Values.length === 0
    ) {

        alert(
            "Both wheels must contain values."
        );

        return;

    }


    const rollPlayers =
        spinDisplayMode === "team"
            ? wheel1Values.slice(
                0,
                5
            )
            : wheel1Values;


    const selectedPlayer =
        rollPlayers[
            Math.floor(
                Math.random() *
                rollPlayers.length
            )
        ];


    let selectedAgent =
        wheel2Values[
            Math.floor(
                Math.random() *
                wheel2Values.length
            )
        ];


    if (
        !canAssignAgentToPlayer(
            selectedPlayer,
            selectedAgent
        )
    ) {

        const usedAgents =
            getUsedAgents();


        let availableAgents =
            wheel2Values.filter(
                agent =>
                    !usedAgents.includes(
                        agent
                    ) &&
                    canAssignAgentToPlayer(
                        selectedPlayer,
                        agent
                    )
            );


        if (
            availableAgents.length === 0
        ) {

            resetAgentMemory();

            availableAgents =
                wheel2Values.filter(
                    agent =>
                        !usedAgents.includes(
                            agent
                        ) &&
                        canAssignAgentToPlayer(
                            selectedPlayer,
                            agent
                        )
                );

        }


        if (
            availableAgents.length === 0
        ) {

            isRolling = false;

            alert(
                "No unique agents remain for this player."
            );

            return;

        }


        selectedAgent =
            availableAgents[
                Math.floor(
                    Math.random() *
                    availableAgents.length
                )
            ];

    }


    saveUndoState();


    isRolling = true;


    let teamSpinResult =
        null;

    let activeTeamReel =
        null;


    if (
        spinDisplayMode ===
        "team"
    ) {

        activeTeamReel =
            getTeamSlotReel(
                selectedPlayer
            );


        if (activeTeamReel) {

            teamSpinResult =
                await spinCasinoReel(
                activeTeamReel,
                wheel2Values,
                selectedAgent,
                4000
            );

        }

    } else {

        await Promise.all([

            spinDisplayToValue(
                ctx1,
                casinoReel1,
                wheel1Values,
                selectedPlayer,
                4000
            ),

            spinDisplayToValue(
                ctx2,
                casinoReel2,
                wheel2Values,
                selectedAgent,
                6000
            )

        ]);

    }


    if (
        teamSpinResult &&
        teamSpinResult.nearSignatureMiss &&
        !getPlayerAgentLabel(
            selectedPlayer,
            selectedAgent
        )
    ) {

        await playNearMissTease(
            activeTeamReel
        );

        showSignatureCelebration(
            getRandomCelebrationText(
                NEAR_MISS_LABELS,
                1
            ),
            false,
            true
        );

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    1200
                )
        );

    } else if (
        isSignatureAgentForPlayer(
            selectedPlayer,
            selectedAgent
        ) ||
        getPlayerAgentLabel(
            selectedPlayer,
            selectedAgent
        )
    ) {

        showSignatureCelebration(
            getSignatureCelebrationText(
                selectedPlayer,
                selectedAgent,
                1
            )
        );

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    1200
                )
        );

    }


    addResult(
        selectedPlayer,
        selectedAgent
    );


    isRolling = false;

}

/* =========================================================
   Shuffle
========================================================= */

function shuffleArray(
    array
) {

    const result =
        [...array];


    for (
        let i =
            result.length - 1;

        i > 0;

        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            result[i],
            result[j]
        ] =
        [
            result[j],
            result[i]
        ];

    }


    return result;

}


/* =========================================================
   UNDO
========================================================= */

function undo() {

    if (
        undoStack.length === 0
    ) {

        return;

    }


    const previousState =
        undoStack.pop();


    restoreState(
        previousState
    );

}

/* =========================================================
   Animated reroll for an RD 100% ANIM row
========================================================= */

async function rerollAnimatedRoleRow(
    row
) {

    if (isRolling) {
        return;
    }


    const player =
        row.dataset.value1;

    const role =
        row.dataset.role;


    if (!player || !role) {
        return;
    }


    const usedAgents =
        new Set(
            Array.from(
                results.querySelectorAll(
                    ".result-row"
                )
            )
            .filter(
                otherRow =>
                    otherRow !== row &&
                    otherRow.dataset.type ===
                        "role"
            )
            .map(
                otherRow =>
                    otherRow.dataset.value2
            )
        );


    function getAvailableAgents() {

        return shuffleArray(
            getAgentsForRole(
                role
            )
            .filter(
                agent =>
                    agent !==
                        row.dataset.value2 &&
                    !usedAgents.has(
                        agent
                    ) &&
                    canAssignAgentToPlayer(
                        player,
                        agent
                    )
            )
        );

    }


    let availableAgents =
        getAvailableAgents();


    if (availableAgents.length === 0) {

        resetAgentMemory();

        availableAgents =
            getAvailableAgents();

    }


    if (availableAgents.length === 0) {
        return;
    }


    const newAgent =
        availableAgents[0];


    const animatedAgentValues =
        wheel2Values.includes(
            newAgent
        )
            ? wheel2Values
            : [
                ...wheel2Values,
                newAgent
            ];


    isRolling = true;

    document.body.classList.add(
        "draft-animating"
    );


    let teamSpinResult =
        null;

    let activeTeamReel =
        null;


    try {

        if (
            spinDisplayMode ===
            "team"
        ) {

            activeTeamReel =
                getTeamSlotReel(
                    player
                );


            if (activeTeamReel) {

                teamSpinResult =
                    await spinCasinoReel(
                    activeTeamReel,
                    animatedAgentValues,
                    newAgent,
                    4000
                );

            }

        } else {

            await spinDisplayToValue(
                ctx2,
                casinoReel2,
                animatedAgentValues,
                newAgent,
                4000
            );

        }


        if (
            teamSpinResult &&
            teamSpinResult.nearSignatureMiss &&
            !getPlayerAgentLabel(
                player,
                newAgent
            )
        ) {

            await playNearMissTease(
                activeTeamReel
            );

            showSignatureCelebration(
                getRandomCelebrationText(
                    NEAR_MISS_LABELS,
                    1
                ),
                false,
                true
            );

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        1200
                    )
            );

        } else if (
            isSignatureAgentForPlayer(
                player,
                newAgent
            ) ||
            getPlayerAgentLabel(
                player,
                newAgent
            )
        ) {

            showSignatureCelebration(
                getSignatureCelebrationText(
                    player,
                    newAgent,
                    1
                )
            );

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        1200
                    )
            );

        }


        row.dataset.value2 =
            newAgent;


        rememberAgentForPlayer(
            player,
            newAgent
        );


        updateResultNumbers();

    } finally {

        document.body.classList.remove(
            "draft-animating"
        );

        isRolling = false;

    }

}


/* =========================================================
   Animated signature draft reveal
========================================================= */

async function animateSignatureDraft(
    draft
) {

    isRolling = true;

    document.body.classList.add(
        "draft-animating"
    );

    closeWheelSettings();

    closeTeamReady();


    const animatedControls = [
        ...document.querySelectorAll(
            ".controls button"
        ),
        wheelSettingsButton,
        teamSlotsSettingsButton
    ];


    const previousDisabledStates =
        animatedControls.map(
            button =>
                button.disabled
        );


    animatedControls.forEach(
        button => {
            button.disabled = true;
        }
    );


    const totalSignatureHits =
        draft.filter(
            item =>
                isSignatureAgentForPlayer(
                    item.player,
                    item.agent
                )
        )
        .length;


    let revealedSignatureHits =
        0;

    let revealedNearMisses =
        0;


    let teamSpinPromises =
        null;

    let teamPlayerSpinPromises =
        null;


    if (
        spinDisplayMode ===
        "team"
    ) {

        renderTeamSlots(
            draft.map(
                item =>
                    item.player
            )
        );


        teamPlayerSpinPromises =
            draft.map(
                (item, index) => {

                    const teamReel =
                        getTeamSlotReel(
                            item.player
                        );

                    const playerLabel =
                        teamReel
                            ?.closest(
                                ".team-slot-column"
                            )
                            ?.querySelector(
                                ".team-slot-player"
                            );


                    return playerLabel
                        ? spinTeamPlayerLabel(
                            playerLabel,
                            wheel1Values,
                            item.player,
                            1000 +
                                index * 3500
                        )
                        : Promise.resolve();

                }
            );


        teamSpinPromises =
            draft.map(
                (item, index) => {

                    const teamReel =
                        getTeamSlotReel(
                            item.player
                        );


                    const agentValues =
                        wheel2Values.includes(
                            item.agent
                        )
                            ? wheel2Values
                            : [
                                ...wheel2Values,
                                item.agent
                            ];


                    return teamReel
                        ? spinCasinoReel(
                            teamReel,
                            agentValues,
                            item.agent,
                            2000 +
                                index * 3500,
                            index ===
                                draft.length - 1
                        )
                        : Promise.resolve();

                }
            );

    }


    try {

        for (
            let draftIndex = 0;
            draftIndex < draft.length;
            draftIndex++
        ) {

            const item =
                draft[draftIndex];

            const animatedPlayerValues =
                wheel1Values.includes(
                    item.player
                )
                    ? wheel1Values
                    : [
                        ...wheel1Values,
                        item.player
                    ];


            const animatedAgentValues =
                wheel2Values.includes(
                    item.agent
                )
                    ? wheel2Values
                    : [
                        ...wheel2Values,
                        item.agent
                    ];


            let teamSpinResult =
                null;


            if (
                spinDisplayMode ===
                "team"
            ) {

                await teamPlayerSpinPromises[
                    draftIndex
                ];

                teamSpinResult =
                    await teamSpinPromises[
                    draftIndex
                ];

            } else {

                await Promise.all([

                    spinDisplayToValue(
                        ctx1,
                        casinoReel1,
                        animatedPlayerValues,
                        item.player,
                        3600
                    ),

                    spinDisplayToValue(
                        ctx2,
                        casinoReel2,
                        animatedAgentValues,
                        item.agent,
                        5200
                    )

                ]);

            }


            const isSignatureHit =
                isSignatureAgentForPlayer(
                    item.player,
                    item.agent
                );

            const hasPlayerAgentLabel =
                Boolean(
                    getPlayerAgentLabel(
                        item.player,
                        item.agent
                    )
                );


            if (
                !isSignatureHit &&
                !hasPlayerAgentLabel &&
                teamSpinResult &&
                teamSpinResult.nearSignatureMiss
            ) {

                await playNearMissTease(
                    getTeamSlotReel(
                        item.player
                    )
                );

            }


            addResult(
                item.player,
                item.agent,
                false,
                item.role,
                "role",
                false,
                true
            );


            if (isSignatureHit) {

                revealedSignatureHits++;


                const isJackpot =
                    totalSignatureHits ===
                        draft.length &&
                    revealedSignatureHits ===
                        draft.length;


                showSignatureCelebration(
                    isJackpot
                        ? "JACKPOT"
                        : getSignatureCelebrationText(
                            item.player,
                            item.agent,
                            revealedSignatureHits
                        ),
                    isJackpot
                );

            } else if (
                hasPlayerAgentLabel
            ) {

                showSignatureCelebration(
                    getSignatureCelebrationText(
                        item.player,
                        item.agent,
                        1
                    )
                );

            } else if (
                teamSpinResult &&
                teamSpinResult.nearSignatureMiss
            ) {

                revealedNearMisses++;

                showSignatureCelebration(
                    getRandomCelebrationText(
                        NEAR_MISS_LABELS,
                        Math.min(
                            revealedNearMisses,
                            3
                        )
                    ),
                    false,
                    true
                );

            }


            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        isSignatureHit ||
                        hasPlayerAgentLabel ||
                        (
                            teamSpinResult &&
                            teamSpinResult.nearSignatureMiss
                        )
                            ? 1200
                            : 350
                    )
            );

        }


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    450
                )
        );

        showTeamReady(
            draft
        );

    } finally {

        document.body.classList.remove(
            "draft-animating"
        );

        drawWheel(
            ctx1,
            wheel1Values,
            wheel1Rotation
        );

        drawWheel(
            ctx2,
            wheel2Values,
            wheel2Rotation
        );


        animatedControls.forEach(
            (button, index) => {

                button.disabled =
                    previousDisabledStates[index];

            }
        );


        isRolling = false;

    }

}
